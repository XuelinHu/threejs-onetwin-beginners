<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工业控制 - Three.js 新手案例</title><style>body{margin:0;background:#061019;color:#e8f7ff;font-family:Segoe UI,Arial,sans-serif}*{box-sizing:border-box}button{font:inherit;color:inherit;cursor:pointer}.app{width:min(1480px,calc(100% - 30px));margin:auto;min-height:100vh;padding:16px 0;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px}.viewport{position:relative;min-height:720px;border:1px solid #235165;background:#07151e;overflow:hidden;border-radius:8px}#scene{display:block;width:100%;height:100%}.title{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between}.title h1{margin:0;color:#7e9cff;font-size:clamp(22px,3vw,42px);letter-spacing:.08em}.title p{margin:7px 0;color:#91aebb;font-size:12px}.tag{position:absolute;padding:7px 10px;border:1px solid #7e9cff;background:#041922dd;color:#dffbff;transform:translate(-50%,-50%);font-size:12px}.selection{position:absolute;bottom:20px;left:20px;padding:9px 12px;border:1px solid #235165;background:#041721e8;color:#bfeeff;font-size:12px}.side{display:flex;flex-direction:column;gap:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px;border:1px solid #235165;background:#0b202b}.stat small{display:block;color:#91aebb;font-size:11px}.stat b{display:block;margin-top:7px;color:#7e9cff;font-size:24px}.panel{border:1px solid #235165;background:#0a1d27ee;border-radius:7px;overflow:hidden}.toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:11px;border-bottom:1px solid #235165}.toolbar button{border:1px solid #2d7184;background:#0b2a36;padding:6px 8px;font-size:12px}.toolbar button:hover{border-color:#7e9cff}.panel h2{margin:0;padding:12px 14px;border-bottom:1px solid #235165;font-size:14px;color:#7e9cff}table{width:100%;border-collapse:collapse;font-size:12px}td{padding:10px 13px;border-bottom:1px solid #163c48}td:last-child{text-align:right}.ok{color:#4de09a}.warn{color:#ffca70}.bad{color:#ff7186}.lesson{padding:14px;color:#a6c4ce;font-size:12px;line-height:1.8}.back{position:fixed;right:16px;bottom:14px;color:#7e9cff;font-size:12px}@media(max-width:980px){.app{grid-template-columns:1fr}.viewport{min-height:58vh}}</style></head><body><main class="app"><section class="viewport"><canvas id="scene"></canvas><div class="title"><div><h1>工业控制</h1><p>工业制造 / 控制台 - OneTwin 风格独立复现教学</p></div><div id="clock"></div></div><div class="tag" style="left:30%;top:34%">控制柜 A</div><div class="tag" style="left:50%;top:44%">输送线 B</div><div class="tag" style="left:70%;top:54%">安全区域</div><div id="selection" class="selection">点击三维设备查看详情</div></section><aside class="side"><div class="stats"><div class="stat"><small>在线节点</small><b>42</b></div><div class="stat"><small>控制延迟</small><b>38ms</b></div><div class="stat"><small>运行率</small><b>98.2%</b></div><div class="stat"><small>今日指令</small><b>1,286</b></div></div><section class="panel"><div class="toolbar"><button class="active" data-camera="overview">总览</button><button data-camera="device">设备</button><button data-camera="top">维护</button><button data-weather="morning">早晨</button><button data-weather="noon">白天</button><button data-weather="evening">傍晚</button><button data-weather="night">夜晚</button><button id="refresh">刷新数据</button></div><h2>设备运行状态</h2><table><tbody id="rows"></tbody></table></section><section class="panel"><h2>本案例学习重点</h2><div class="lesson"><strong>学习 Object3D 层级、射线拾取和 DOM 面板，把设备状态映射成材质颜色。</strong><br>AI 提示词、示例代码和练习见上级 blog 目录。</div></section></aside></main><a class="back" href="../">返回项目目录</a><script type="module">
import * as THREE from './vendor/three.module.js';
const cfg={"title": "工业控制", "category": "工业制造 / 控制台", "accent": "#7e9cff", "kind": "control", "devices": [["PLC-01", "运行", "ok"], ["CONV-02", "运行", "ok"], ["ROBOT-03", "待机", "warn"], ["SENSOR-04", "故障", "bad"]]};const canvas=document.querySelector('#scene'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(50,1,.1,120);camera.position.set(0,6,12);camera.lookAt(0,1.4,0);const renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0x07141c);const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(-6,10,7);scene.add(new THREE.HemisphereLight(0xa9ddff,0x091116,1.35),key);const group=new THREE.Group();scene.add(group);const ray=new THREE.Raycaster(),objects=[];const steel=new THREE.MeshStandardMaterial({color:0x29515d,metalness:.35,roughness:.48}),accent=new THREE.MeshStandardMaterial({color:cfg.accent,emissive:cfg.accent,emissiveIntensity:.35,metalness:.35,roughness:.4}),alert=new THREE.MeshStandardMaterial({color:0x9b3044,emissive:0x5b1023,emissiveIntensity:1.1});function box(w,h,d,x,y,z,m,label){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||steel);o.position.set(x,y,z);o.userData={label:label||'设备'};group.add(o);objects.push(o)}function cyl(r,h,x,y,z,m,label){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),m||accent);o.position.set(x,y,z);o.userData={label:label||'设备'};group.add(o);objects.push(o)}box(16,.22,10,0,-.11,0,steel,'地面');if(cfg.kind==='gmp'){for(let x=-6;x<=6;x+=3)box(1.9,2.8,2.1,x,1.4,0,steel,'制药设备');cyl(1.2,3,-3,1.5,-3,accent,'配液罐');cyl(1,2,3,1,-3,alert,'灌装设备')}if(cfg.kind==='control'){for(let x=-6;x<=6;x+=3)box(1.8,2.2,2,x,1.1,0,steel,'控制柜');for(let z=-4;z<=4;z+=2)box(9,.22,.6,0,.5,z,accent,'输送线')}if(cfg.kind==='hall'){for(let x=-5;x<=5;x+=2.5){box(1.6,.4,1.6,x,.2,0,accent,'展台');cyl(.45,1.7,x,1.05,0,accent,'展品')}box(12,4,.2,0,2,-4,accent,'生态墙')}if(cfg.kind==='ops'){for(let x=-6;x<=6;x+=3){box(1.7,3,1.8,x,1.5,0,steel,'运维设备');cyl(.38,.35,x,3.3,0,accent,'状态灯')}box(10,.15,.2,0,4,-3,accent,'维修轨道')}if(cfg.kind==='energy'){for(let x=-6;x<=6;x+=3)for(let z=-2;z<=2;z+=2)box(1.8,.15,1.1,x,1,z,accent,'光伏阵列');cyl(1,3,-3,1.5,-3,steel,'储能舱');cyl(.65,3,4,1.5,0,accent,'风机')}const cams={overview:[[0,6,12],[0,1.4,0]],device:[[7,4,7],[0,1.5,0]],top:[[-8,5,6],[0,1.2,0]]};document.querySelectorAll('[data-camera]').forEach(function(b){b.onclick=function(){const v=cams[b.dataset.camera];camera.position.set.apply(camera.position,v[0]);camera.lookAt.apply(camera,v[1])}});const weather={morning:[0x172b3b,0xffe2bd,2.2],noon:[0x07141c,0xffffff,2.8],evening:[0x25182a,0xff9f70,1.7],night:[0x02050e,0x4c76bd,1]};document.querySelectorAll('[data-weather]').forEach(function(b){b.onclick=function(){const v=weather[b.dataset.weather];scene.background=new THREE.Color(v[0]);key.color.set(v[1]);key.intensity=v[2]}});const rows=document.querySelector('#rows'),selection=document.querySelector('#selection');function renderRows(){rows.innerHTML=cfg.devices.map(function(d){return '<tr><td>'+d[0]+'</td><td class="'+d[2]+'">'+d[1]+'</td></tr>'}).join('')}function update(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});renderRows()}renderer.domElement.addEventListener('click',function(e){const r=renderer.domElement.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);const hit=ray.intersectObjects(objects)[0];if(hit){selection.textContent='已选中：'+hit.object.userData.label;if(hit.object.material.emissive)hit.object.material.emissive.set(cfg.accent)}});document.querySelector('#refresh').onclick=update;addEventListener('resize',function(){const r=canvas.parentElement.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()});let t=0;function frame(){requestAnimationFrame(frame);t+=.008;group.rotation.y=Math.sin(t)*.05;renderer.render(scene,camera)}update();frame();</script><script type="module" src="./audio.mjs"></script>
</body></html>
